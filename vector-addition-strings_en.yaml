a11y:
  explore1DScreen:
    screenButtonsHelpText: Explore vector addition in one dimension.
    screenSummary:
      playArea:        >-
                       There is an open graph area where you can add vectors and modify their
                       position, magnitude, and direction, as well as explore the vectors’ sum.
      controlArea:     >-
                       Turn on vector sum, values, and grid. Modify position of graph area
                       origin. Switch between horizontal and vertical scenes, or reset the
                       screen.
      currentDetails:  >-
                       Currently, { $numberOfVectors } vectors in graph area. { $sceneName }
                       scene selected.
      interactionHint: Add vectors to graph area to begin exploring.
  explore2DScreen:
    screenButtonsHelpText: Explore vector addition in two dimensions.
    screenSummary:
      playArea:        >-
                       There is an open graph area where you can add vectors and modify their
                       position, magnitude, and direction, as well as explore the vectors’ sum.
      controlArea:     >-
                       Turn on vector sum, values, angles, and grid. Display vector components.
                       Modify position of graph area origin. Switch between Cartesian and polar
                       scenes, or reset screen.
      currentDetails:  >-
                       Currently, { $numberOfVectors } vectors in graph area. { $sceneName }
                       scene selected.
      interactionHint: Add vectors to graph area to begin exploring.
  labScreen:
    screenButtonsHelpText: Experiment with two independent sets of vectors.
    screenSummary:
      playArea:        >-
                       There is an open graph area where you can add vectors from two sets and
                       modify their position, magnitude, and direction. You can also explore
                       and compare vector sums for each set.
      controlArea:     >-
                       Turn on vector sums, values, angles, and grid. Display vector
                       components. Modify position of graph area origin. Switch between
                       Cartesian and polar scenes, or reset screen.
      currentDetails:  >-
                       Currently, { $vectorSet1Size } vectors from set { $vectorSet1Symbol } and
                       { $vectorSet2Size } vectors from set { $vectorSet2Symbol } in graph area.
                       { $sceneName } scene selected.
      interactionHint: Add vectors to graph area to begin exploring.
  equationsScreen:
    screenButtonsHelpText: Explore and manipulate vector equations.
    screenSummary:
      playArea:        >-
                       There is an open graph area showing vectors from the selected equation.
                       Modify position, magnitude, direction, and scaling of these vectors, and
                       explore how changes to the equation and coefficients affect vectors in
                       graph area.
      controlArea:     >-
                       Choose equation determining how three vectors interrelate. Select
                       coefficients for scaling vectors { $symbol1 } and { $symbol2 }. Turn on
                       vector { $symbol3 }, values, angles, and grid, and components. Set
                       components of base vectors, and choose to add them to graph area. Modify
                       position of graph area origin. Switch between Cartesian and polar
                       scenes, or reset entire screen.
      currentDetails:
        select_equationType:
          addition:    >-
                       Currently, equation is { $coefficient1 } times base vector { $symbol1 }
                       plus { $coefficient2 } times base vector { $symbol2 } equals vector
                       { $symbol3 }.
          subtraction: >-
                       Currently, equation is { $coefficient1 } times base vector { $symbol1 }
                       minus { $coefficient2 } times base vector { $symbol2 } equals vector
                       { $symbol3 }.
          negation:    >-
                       Currently, equation is { $coefficient1 } times base vector { $symbol1 }
                       plus { $coefficient2 } times base vector { $symbol2 } plus vector
                       { $symbol3 } equals zero.
      interactionHint: >-
                       Modify equation type and its coefficients to explore how changes in the
                       equation affect vectors in graph area.
  accessibleHeadings:
    availableVectors: Available Vectors
    graphAreaHeading: Graph Area
  graphArea:
    accessibleParagraphExplore:   '{ $numberOfVectors } vectors in graph area.'
    accessibleParagraphLab:       >-
                                  { $vectorSet1Size } vectors from set { $vectorSet1Symbol } and
                                  { $vectorSet2Size } vectors from set { $vectorSet2Symbol } in graph area.
    accessibleParagraphEquations: '{ $numberOfVectors } vectors in graph area.'
  horizontalSceneName:        Horizontal
  verticalSceneName:          Vertical
  cartesianSceneName:         Cartesian
  polarSceneName:             Polar
  anglesCheckbox:
    accessibleName:     Angles
    accessibleHelpText: Display vector angles in graph area.
  gridCheckbox:
    accessibleName:     Grid
    accessibleHelpText: Explore with or without use of visual grid.
  sumCheckbox:
    accessibleName:                     Vector Sum, { $symbol }
    accessibleHelpText:                 Show or hide vector { $symbol }, if defined.
    accessibleContextResponseChecked:   Vector { $symbol } visibility enabled.
    accessibleContextResponseUnchecked: Vector { $symbol } visibility disabled.
  labSumCheckbox:
    accessibleName: Vector Sum for Set { $vectorSetSymbol }, { $sumSymbol }
  equationsSumCheckbox:
    accessibleName: Vector { $symbol }
  valuesCheckbox:
    accessibleHelpText: Display vector and component magnitudes in graph area.
  componentsRadioButtonGroup:
    accessibleName:     Components Display Style
    accessibleHelpText: Choose whether and where to display vector x y components.
  invisibleRadioButton:
    accessibleName: Hidden
  triangleRadioButton:
    accessibleName: Right triangle
  parallelogramRadioButton:
    accessibleName: From vector tail
  projectionRadioButton:
    accessibleName: Projected onto x y axes
  cartesianPolarSceneRadioButtonGroup:
    accessibleName:     Scene
    accessibleHelpText: >-
                        Switch between independent scenes with their own vectors and graph areas.
                        Cartesian scene vectors snap to integer x and y components. Polar scene
                        vectors snap to integer magnitudes and angle multiples of
                        { $polarAngleInterval } degrees.
  cartesianRadioButton:
    accessibleName: Cartesian scene
  polarRadioButton:
    accessibleName: Polar scene
  horizontalVerticalSceneRadioButtonGroup:
    accessibleName:     Scene
    accessibleHelpText: Switch between independent scenes with their own vectors and graph areas.
  horizontalRadioButton:
    accessibleName: Horizontal scene
  verticalRadioButton:
    accessibleName: Vertical scene
  equationTypeRadioButtonGroup:
    accessibleName:     Equation Type
    accessibleHelpText: >-
                        Choose the equation that determines how vectors { $symbol1 }, { $symbol2 },
                        and { $symbol3 } interrelate.
  additionRadioButton:
    accessibleName: '{ $symbol1 } plus { $symbol2 } equals { $symbol3 }'
  subtractionRadioButton:
    accessibleName: '{ $symbol1 } minus { $symbol2 } equals { $symbol3 }'
  negationRadioButton:
    accessibleName: '{ $symbol1 } plus { $symbol2 } plus { $symbol3 } equals zero'
  baseVectorsCheckbox:
    accessibleName:     Base Vectors
    accessibleHelpText: Show or hide base vectors in graph area.
  originManipulator:
    accessibleName:           Graph Area Origin
    accessibleHelpText:       Move to relocate graph area origin, which changes x axis and y axis spans.
    accessibleObjectResponse: 'x axis spans { $minX } to { $maxX }, y axis spans { $minY } to { $maxY }'
  eraserButton:
    accessibleName:            Erase all vectors
    accessibleHelpText:        Remove all vectors from graph area.
    accessibleContextResponse: Graph area cleared
  vectorValuesAccordionBox:
    accessibleParagraph:                  >-
                                          For vector { $symbol }: magnitude is { $magnitude }; direction is
                                          { $direction } degrees from positive x axis; x component is { $xComponent };
                                          y component is { $yComponent }.
    accessibleHelpTextCollapsed:          Show magnitude, direction, and components of selected vector.
    accessibleParagraphBaseVector:        >-
                                          For base vector { $symbol }: magnitude is { $magnitude }; direction is
                                          { $direction } degrees from positive x axis; x component is { $xComponent };
                                          y component is { $yComponent }.
    accessibleParagraphCoefficientVector: >-
                                          For vector { $coefficient } { $symbol }: magnitude is { $magnitude };
                                          direction is { $direction } degrees from positive x axis; x component is
                                          { $xComponent }; y component is { $yComponent }.
  equationAccordionBox:
    accessibleHelpTextCollapsed: >-
                                 Choose equation determining how three vectors interrelate, and adjust
                                 coefficients for scaled vectors.
  symbolSubSubscript:         '{ $symbol } sub { $subscript }'
  signedRadioButton:          signed, negative 180 to positive 180 degrees
  unsignedRadioButton:        unsigned, 0 to 360 degrees
  baseVectorXComponentPicker:
    accessibleName:     Base vector { $symbol }, x component
    accessibleHelpText: Choose horizontal component of base vector { $symbol }.
  baseVectorYComponentPicker:
    accessibleName:     Base vector { $symbol }, y component
    accessibleHelpText: Choose vertical component of base vector { $symbol }.
  baseVectorMagnitudePicker:
    accessibleName:     Base vector { $symbol }, magnitude
    accessibleHelpText: Choose magnitude of base vector { $symbol }.
  baseVectorAnglePicker:
    accessibleName:     Base vector { $symbol }, direction
    accessibleHelpText: Choose direction of base vector { $symbol }, in degrees from positive x axis.
  coefficientPicker:
    accessibleName:     Vector { $symbol } Coefficient
    accessibleHelpText: Choose coefficient to multiply base vector in equation.
  vectorButton:
    accessibleName:     Vector { $symbol }
    accessibleHelpText: Add vector { $symbol } to graph area.
  vectorSetButton:
    accessibleName:          Vector Set { $symbol }
    accessibleHelpText:      Add vector from set { $symbol } to graph area.
    accessibleHelpTextEmpty: Disabled when empty.
  vectorNode:
    body:
      accessibleName:                              Vector { $symbol }
      accessibleHelpText:                          Move to change position of vector.
      accessibleObjectResponse:                    tail at { $tailX } { $tailY }, tip at { $tipX } { $tipY }
      accessibleObjectResponseTipOutsideGraphArea: >-
                                                   tail at { $tailX } { $tailY }, tip at { $tipX } { $tipY }, tip outside graph area
    tip:
      accessibleName:     Vector { $symbol } tip
      accessibleHelpText: Move to change position of vector tip.
      accessibleObjectResponse:
        select_coordinateSnapMode:
          cartesian:
            select_tipReturnedToGraphArea:
              true:  tip at { $tipX } { $tipY }, tip returned to graph area
              false: tip at { $tipX } { $tipY }
          polar:
            select_tipReturnedToGraphArea:
              true:  >-
                     magnitude { $magnitude }, direction { $angle } degrees, tip returned to
                     graph area
              false: magnitude { $magnitude }, direction { $angle } degrees
  equationsVectorNode:
    accessibleName: '{ $coefficient } { $symbol }'
  baseVectorNode:
    accessibleName: Base Vector { $symbol }
  vectorAddedToGraphArea:     Vector { $symbol } added to graph area.
  vectorRemovedFromGraphArea: Vector { $symbol } removed from graph area.
